; ==============================================================================
; Supervisor Configuration for LYORA Queue Workers & Reverb WebSocket
; Place in: /etc/supervisor/conf.d/lyora.conf
; ==============================================================================

[program:lyora-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/lyora/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/lyora-worker.log
stopwaitsecs=3600

[program:lyora-reverb]
command=php /var/www/lyora/backend/artisan reverb:start
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/lyora-reverb.log
