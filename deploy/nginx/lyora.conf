# ==============================================================================
# Nginx Reverse Proxy Configuration for LYORA
# /etc/nginx/sites-available/lyora.conf
# ==============================================================================

# 1. Frontend Next.js (https://lyora.solvianova.com)
server {
    listen 80;
    server_name lyora.solvianova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lyora.solvianova.com;

    ssl_certificate /etc/letsencrypt/live/lyora.solvianova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyora.solvianova.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Backend Laravel API (https://api.lyora.solvianova.com)
server {
    listen 80;
    server_name api.lyora.solvianova.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lyora.solvianova.com;
    root /var/www/lyora/backend/public;

    ssl_certificate /etc/letsencrypt/live/api.lyora.solvianova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lyora.solvianova.com/privkey.pem;

    index index.php index.html;
    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket for Laravel Reverb
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
